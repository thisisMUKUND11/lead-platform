# Render Blueprint — deploys the Dart Frog backend as a Docker web service.
# In Render: New → Blueprint → connect this repo. Render reads this file.
# Then set the two secret env vars (DATABASE_URL, CORS_ORIGINS) in the dashboard.
services:
  - type: web
    name: lead-platform-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Render generates a strong random secret for signing JWTs.
      - key: JWT_SECRET
        generateValue: true
      # Set these in the dashboard (marked secret; not stored in git):
      #   DATABASE_URL  → your Supabase *Session pooler* connection string
      #   CORS_ORIGINS  → your deployed frontend origin (or * while testing)
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
