name: Deploy frontend (GitHub Pages)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yaml'

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      # API_BASE_URL is a repository variable (Settings → Secrets and
      # variables → Actions → Variables). Set it to the deployed API root.
      - name: Build web
        working-directory: frontend
        run: >-
          flutter build web --release
          --base-href /lead-platform/
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

      - id: deployment
        uses: actions/deploy-pages@v4
