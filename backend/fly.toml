# Fly.io configuration for the Lead Platform API.
# Rename `app` to a unique name (fly launch will prompt) before deploying.
app = "lead-platform-api"
primary_region = "sin"   # change to your nearest region

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Secrets (DATABASE_URL, JWT_SECRET, CORS_ORIGINS) are NOT stored here.
# Set them with:  fly secrets set DATABASE_URL=... JWT_SECRET=... CORS_ORIGINS=...
